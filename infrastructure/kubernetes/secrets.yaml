apiVersion: v1
kind: Secret
metadata:
  name: industrial-ai-secrets
  namespace: industrial-ai
  labels:
    app: industrial-ai
type: Opaque

stringData:
  # PostgreSQL
  POSTGRES_USER: "industrial_user"
  POSTGRES_PASSWORD: "REPLACE_WITH_STRONG_PASSWORD"

  # Application database
  DB_USER: "industrial_user"
  DB_PASSWORD: "REPLACE_WITH_STRONG_PASSWORD"

  # Authentication
  JWT_SECRET_KEY: "REPLACE_WITH_RANDOM_SECRET"
  SECRET_KEY: "REPLACE_WITH_RANDOM_SECRET"

  # External LLM providers
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""

  # Notifications
  SMTP_USERNAME: ""
  SMTP_PASSWORD: ""

  # Monitoring
  GRAFANA_ADMIN_PASSWORD: "REPLACE_WITH_STRONG_PASSWORD"