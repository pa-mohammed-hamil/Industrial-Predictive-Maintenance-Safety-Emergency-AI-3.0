apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: industrial-ai
  labels:
    app: qdrant

spec:
  type: ClusterIP

  selector:
    app: qdrant

  ports:
    - name: http
      port: 6333
      targetPort: 6333
      protocol: TCP

    - name: grpc
      port: 6334
      targetPort: 6334
      protocol: TCP

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qdrant
  namespace: industrial-ai
  labels:
    app: qdrant

spec:
  serviceName: qdrant
  replicas: 1

  selector:
    matchLabels:
      app: qdrant

  template:
    metadata:
      labels:
        app: qdrant

    spec:
      securityContext:
        fsGroup: 1000

      containers:
        - name: qdrant
          image: qdrant/qdrant:v1.12.6
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 6333

            - name: grpc
              containerPort: 6334

          env:
            - name: QDRANT__SERVICE__HTTP_PORT
              value: "6333"

            - name: QDRANT__SERVICE__GRPC_PORT
              value: "6334"

            - name: QDRANT__STORAGE__STORAGE_PATH
              value: "/qdrant/storage"

          volumeMounts:
            - name: qdrant-storage
              mountPath: /qdrant/storage

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"

            limits:
              cpu: "2000m"
              memory: "2Gi"

          readinessProbe:
            httpGet:
              path: /readyz
              port: 6333
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5

          livenessProbe:
            httpGet:
              path: /healthz
              port: 6333
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5

  volumeClaimTemplates:
    - metadata:
        name: qdrant-storage

      spec:
        accessModes:
          - ReadWriteOnce

        resources:
          requests:
            storage: 10Gi