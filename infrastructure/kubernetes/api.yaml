apiVersion: apps/v1
kind: Deployment
metadata:
  name: industrial-ai-api
  labels:
    app: industrial-ai-api

spec:
  replicas: 2

  selector:
    matchLabels:
      app: industrial-ai-api

  template:
    metadata:
      labels:
        app: industrial-ai-api

    spec:
      containers:
        - name: api
          image: industrial-ai-api:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000

          envFrom:
            - configMapRef:
                name: industrial-ai-config
            - secretRef:
                name: industrial-ai-secrets

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

---
apiVersion: v1
kind: Service
metadata:
  name: industrial-ai-api
  labels:
    app: industrial-ai-api

spec:
  type: ClusterIP

  selector:
    app: industrial-ai-api

  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP